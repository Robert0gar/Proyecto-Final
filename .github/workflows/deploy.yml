name: CI/CD Pipeline - Migajas Pati

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-coverage:
    name: Pruebas Unitarias
    runs-on: ubuntu-latest

    steps:
      - name: Clonar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

      - name: Reconstruir módulos nativos
        run: npm rebuild better-sqlite3

      - name: Ejecutar Pruebas Automatizadas
        run: npm test
        env:
          NODE_ENV: test
          CI: true
          JWT_SECRET: 'supersecret_jwt_key_test'
          PORT: 3000

  deploy-staging:
    name: Despliegue Automático en Entorno de Pruebas
    needs: test-and-coverage
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Clonar código del repositorio
        uses: actions/checkout@v4

      - name: Simulación de Despliegue en Servidor de Pruebas (Staging)
        run: |
          echo "=================================================="
          echo "Iniciando Despliegue en Servidor de Staging..."
          echo "Rama desplegada: ${{ github.ref }}"
          echo "Despliegue simulado exitosamente en el entorno de pruebas."
          echo "=================================================="